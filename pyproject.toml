[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".git", ".venv", "data", "static/vendor"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "SIM", "S", "RUF007", "RUF046"]

[tool.ruff.lint.per-file-ignores]
"main.py" = ["S104"] # The local development server and container must accept HTTP traffic.
"old_algorithm/optimizer_v1.py" = ["S311"] # The legacy optimizer intentionally uses non-cryptographic randomness.
"tests/**" = ["S105"]
